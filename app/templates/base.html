<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#7a5c2e">
<title>{% block title %}Plünderliste{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <a href="/" class="brand">Plünderliste</a>
  <nav><a href="/">Liste</a><a href="/settings">Einstellungen</a></nav>
</header>
<main>{% block content %}{% endblock %}</main>
<script>
function copyText(btn, text) {
  const done = () => { const o = btn.textContent; btn.textContent = "Kopiert"; setTimeout(() => btn.textContent = o, 1200); };
  if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(text).then(done); return; }
  const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta);
  ta.select(); try { document.execCommand("copy"); done(); } finally { ta.remove(); }
}
</script>
</body>
</html>
